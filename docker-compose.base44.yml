services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "exec npx --yes live-server@1.2.2 --host=0.0.0.0 --port=3000 --no-browser --wait=200"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>r.text()).then(t=>process.exit(t.includes('marzipano')?0:1)).catch(()=>{console.error('web not responding');process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
